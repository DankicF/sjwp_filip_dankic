<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .relative {
        background-color: rgb(202, 0, 0);
        position: relative;
        width: 600px;
        height: 450px;
        top: 200px;
        left: 200px;
        border: 6px solid black;
      }
      .absolute {
        background-color: rgb(255, 255, 255);
        position: absolute;
        border-radius: 50%;
        top: 0px;
        left: 75px;
        width: 450px;
        height: 450px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Kontejner za rotaciju cijelog znaka za 45 stupnjeva */
      .znak {
        position: relative;
        width: 240px;
        height: 240px;
        transform: rotate(45deg);
      }

      /* Glavne dvije prekrižene linije (tvoji absolute2 i absolute3) */
      .absolute2 {
        background-color: black;
        position: absolute;
        width: 45px;
        height: 240px;
        left: 97.5px;
        top: 0;
      }
      .absolute3 {
        background-color: black;
        position: absolute;
        width: 240px;
        height: 45px;
        top: 97.5px;
        left: 0;
      }

      /* Četiri vanjska kraka */
      .krak {
        background-color: black;
        position: absolute;
      }
      .gore {
        width: 142.5px;
        height: 45px;
        top: 0;
        left: 97.5px;
      }
      .desno {
        width: 45px;
        height: 142.5px;
        top: 97.5px;
        right: 0;
      }
      .dolje {
        width: 142.5px;
        height: 45px;
        bottom: 0;
        left: 0;
      }
      .lijevo {
        width: 45px;
        height: 142.5px;
        top: 0;
        left: 0;
      }
    </style>
  </head>
  <body>
    <div class="relative">
      <div class="absolute">
        <div class="znak">
          <div class="absolute2"></div>
          <div class="absolute3"></div>
          <div class="krak gore"></div>
          <div class="krak desno"></div>
          <div class="krak dolje"></div>
          <div class="krak lijevo"></div>
        </div>
      </div>
    </div>
  </body>
</html>
