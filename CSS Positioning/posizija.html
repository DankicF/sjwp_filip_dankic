<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .relative {
        background-color: blue;
        position: relative;
        width: 500px;
        height: 300px;
        top: 200px;
        left: 200px;
      }
      .absolute {
        background-color: red;
        position: absolute;
        border-radius: 50%;
        top: 150px;
        left: 250px;
        width: 200px;
        height: 200px;
      }
    </style>
  </head>
  <body>
    <div class="relative">
      <div class="absolute"></div>
    </div>
  </body>
</html>
