<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Star of David</title>
  </head>
  <body>
    <svg width="700" height="700" viewBox="0 0 100 100">
      <!-- Upward pointing triangle -->
      <polygon
        points="50,5 90,75 10,75"
        fill="none"
        stroke="#0038b8"
        stroke-width="5"
      />
      <!-- Downward pointing triangle -->
      <polygon
        points="50,95 90,25 10,25"
        fill="none"
        stroke="#0038b8"
        stroke-width="5"
      />
    </svg>
  </body>
</html>
