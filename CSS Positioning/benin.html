<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
      .relative {
        background-color: rgb(71, 129, 16);
        position: relative;
        width: 600px;
        height: 450px;
        top: 200px;
        left: 200px;
        border: 6px solid black;
      }
      .absolute {
        background-color: rgb(252, 214, 0);
        position: absolute;
        top: 0px;
        left: 250px;
        width: 350px;
        height: 225px;
      }
      .absolute2 {
        background-color: rgb(200, 1, 1);
        position: absolute;
       
        top: 225px;
        left: 250px;
        width: 350px;
        height: 225px;
      } 
      </style>
</head>
<body>
  <div class="relative">
    <div class="absolute"></div>
    <div class="absolute2"></div>
</body>
</html>
