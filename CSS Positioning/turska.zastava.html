<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .relative {
        background-color: rgb(202, 0, 0);
        position: relative;
        width: 600px;
        height: 450px;
        top: 200px;
        left: 200px;
        border: 6px solid black;
      }
      .absolute {
        background-color: rgb(255, 255, 255);
        position: absolute;
        border-radius: 50%;
        top: 0px;
        left: 70px;
        width: 450px;
        height: 450px;
      }
    </style>
  </head>
  <body>
    <div class="relative">
      <div class="absolute"></div>
      <div class="absolute2"></div>
      <div class="absolute3"></div>
    </div>
  </body>
</html>
