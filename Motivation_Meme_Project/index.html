<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motivation Meme</title>

    <!-- 1. Uvoz Libre Baskerville fonta s Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="" rel="stylesheet" />

    <style>
      /* 2. Crna pozadina i bijeli tekst */
      body {
        background-color: black;
        color: white;
        margin: 0;
        padding-top: 50px;
        font-family: "Libre Baskerville", serif;
      }

      /* 4. i 5. Spremnik (div) koji centrira sadržaj (širina 50%, margin-left 25%) i tekst */
      .poster-container {
        width: 50%;
        margin-left: 25%;
        text-align: center;
      }

      /* 3. Slika ispunjava div (width 100%) i ima bijeli rub od 5px */
      .poster-container img {
        width: 100%;
        border: 5px solid white;
        box-sizing: border-box;
      }

      /* 1. i 6. H1 koristi Libre Baskerville font i preoblikovan je u velika slova (uppercase) */
      .poster-container h1 {
        font-family: "Libre Baskerville", serif;
        text-transform: uppercase;
        font-size: 2.2rem;
        margin-top: 25px;
        margin-bottom: 15px;
        letter-spacing: 2px;
      }

      /* Stil za podtekst */
      .poster-container p {
        font-size: 1rem;
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <!-- 5. Div spremnik sa h1, p i img elementima -->
    <div class="poster-container">
      <!-- 3. Putanja do slike unutar assets/images mape -->
      <img
        src="D:\sjwp_filip_dankic\Motivation_Meme_Project\IMG_1561.jpeg"

    </div>
  </body>
